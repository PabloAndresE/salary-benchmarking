[project]
name = "salary-benchmarking-backend"
version = "1.3.0"
description = "Referencias salariales de mercado: homologacion de cargos y bandas por puesto, sector y tamano"
requires-python = "==3.14.*"
# Versiones EXACTAS (estandar): un cambio de torch o transformers puede mover las
# probabilidades del juez sin avisar. Son las del servicio v1.3.
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    "pydantic==2.13.5",
    "numpy==2.4.6",
    "pandas==3.0.3",
    "openpyxl==3.1.5",
    # juez (cross-encoder) y traductor (MarianMT), en CPU
    "torch==2.14.0",
    "transformers==5.17.0",
    "sentencepiece==0.2.2",
    # Vertex AI (embeddings), BigQuery (nominas cargadas) y GCS (artefactos)
    "google-cloud-aiplatform==2.3.0",
    "google-cloud-bigquery==3.46.1",
    "google-cloud-storage==3.16.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.17.2",
    "black==26.10.1",
    "pre-commit==4.7.0",
    # solo para construir bases sinteticas en los tests (`BaseReferencia.construir`)
    "scikit-learn==1.9.0",
    # la foto de respuestas (tests/foto/foto.py) habla con la API por HTTP
    "requests==2.34.2",
]

[tool.uv]
package = false
constraint-dependencies = ["starlette>=0.49.1"]

# torch de CPU: el de PyPI trae CUDA y ~3 GB que en Cloud Run no sirven para nada
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# Las reglas clasicas por defecto. PENDIENTE: alinear con las de plantilla-backend-python.
select = ["E4", "E7", "E9", "F"]

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.pytest.ini_options]
# "." para importar `src.*`; "tests" para el generador `sintetico` y las fixtures
pythonpath = [".", "tests"]
testpaths = ["tests"]
markers = [
    "endpoint: routers con TestClient",
    "service: services, mockeando persistencia e integraciones",
    "integration: clientes de integracion",
    "persistence: acceso a BigQuery",
    "function: logica pura",
    "model: dominio y DTOs",
]
