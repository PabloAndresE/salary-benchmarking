[project]
name = "benchmarking"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0", "google-cloud-bigquery[pandas]>=3.0", "openpyxl>=3.1",
  "requests>=2.31", "pydantic-settings>=2.0", "pyyaml>=6.0", "db-dtypes>=1.0",
  "google-cloud-storage>=2.14",
  # evaluacion: particiones rivales, techo alcanzable, CRPS y graficas
  "scikit-learn>=1.4", "scipy>=1.11", "matplotlib>=3.8",
  # descarga rapida del marco: sin esto van por REST y tarda mas de dos minutos
  "google-cloud-bigquery-storage>=2.24", "pyarrow>=15.0",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# El servicio HTTP es OPCIONAL a proposito: la ruta de investigacion y el CLI no deben
# arrastrar un framework web, y la imagen del pipeline por lotes tampoco.
servicio = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
[project.scripts]
benchmarking = "benchmarking.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]

# El esquema de la plantilla es un .yaml: sin esto pip install NO lo copia y el paquete
# instalado revienta al importar ingesta.composicion. En local no se nota (se ejecuta
# desde src/), solo en la imagen de Cloud Run. El Dockerfile lo verifica con un smoke.
[tool.setuptools.package-data]
benchmarking = ["config/*.yaml"]
[tool.pytest.ini_options]
# "tests" tambien, para que los tests puedan importar el generador `sintetico`
pythonpath = ["src", "tests"]
